# rom.conf -- everything ROM-specific in this recipe, sourced by every script.
# The scripts themselves are the AICP recipe's (riza220201/itel_rs4_AICP), unchanged
# in what they check; only the values below differ per ROM.

ROM_NAME="Axion"
ROM_MANIFEST_URL="https://github.com/AxionAOSP/android.git"
ROM_MANIFEST_BRANCH="lineage-23.2"          # AxionAOSP's default branch; LineageOS 23.2 + android-16.0.0_r4

# The product this ROM builds for the RS4, and its release config (build/make/core/build_id.mk:
# BUILD_ID=BP4A.251205.006 -> bp4a; Axion's vendor/lineage/vars/aosp_target_release agrees).
ROM_PRODUCT="lineage_S666LN"
ROM_RELEASE="bp4a"

# Who must own build/make and build/soong in this checkout (verify-sync check 5):
# "<path>:<repo project name>" pairs, as `repo list` prints them.
ROM_OWNERS="build/make:android_build build/soong:android_build_soong"

# Axion's own entry point: `axion <device> <variant> va` = WITH_GMS=false (vanilla: microG is
# flashed on top, not GApps) + lunch lineage_<device>-<aosp_target_release>-<variant>, plus
# its build-host name overrides. rom-build.sh calls it instead of a bare lunch.
rom_lunch() { axion S666LN "$1" va; }

# The OTA package bacon produces (vendor/lineage/build/tasks/bacon.mk:
# $(PRODUCT_OUT)/axion-$(LINEAGE_VERSION).zip) and the prefix of our signed one.
ROM_ARTIFACT_GLOB="axion-*.zip"
ROM_SIGNED_PREFIX="axion_S666LN"

# Host tools the tree shells out to at parse time (AICP's boot animation needed ImageMagick).
ROM_HOST_TOOLS=""

# The Pixel 10 identity (device tree identity_pixel10.mk), opt-in for the lineage_ product.
# Checked for Axion 2026-11-17: its framework TrickyStore re-signs attestation only with a
# keybox the USER imports (Settings.Secure spoof_trickystore_keybox, set from VendorSupport's
# KeyboxDataPreference); nothing ships one, so the hardware keybox still attests.
export S666LN_IDENTITY=pixel10
